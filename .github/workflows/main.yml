
name: Build PSP Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build PRX
        run: |
          docker pull ghcr.io/pspdev/pspsdk:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workdir" \
            -w /workdir \
            --entrypoint /bin/bash \
            ghcr.io/pspdev/pspsdk:latest \
            /workdir/script

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: ra2d-prx
          path: ra2d.prx
          if-no-files-found: error
